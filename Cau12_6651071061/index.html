<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">	
    <title>Câu 12 - Checkbox Div Hide Show</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h4>Checkbox Div Hide Show</h4>

<div class="checkbox-card">
    <label for="">Do You have Passport</label>
    <div class="checkbox">
        <label>
            <input type="checkbox" class="checkme">Yes
        </label>
    </div>
    <div class="passport-box">
        <input type="text" placeholder="Enter Passport Number" class="form-control">
    </div>
    <div class="apply-box">
        <a href="">Apply For Passport</a>
    </div>
</div>
<br>
<div class="checkbox-card">
    <label for="">Do You have Credit Card</label>
    <div class="checkbox">
        <label>
            <input type="checkbox" class="checkme">Yes
        </label>
    </div>
    <div class="passport-box">
        <input type="text" placeholder="Enter Credit Card Number" class="form-control">
    </div>
    <div class="apply-box">
        <a href="">Apply For Credit Card</a>
    </div>
</div>

<script src="js/jquery-latest.min.js"></script>
<script>
    $(document).ready(function () {
        // Xử lý khi click chọn "Yes" ở Passport hoặc Credit Card
        $('.checkme').on('change', function () {
            var card = $(this).closest('.checkbox-card');
            if (this.checked) {
                // Hiện textbox nhập thông tin
                card.find('.passport-box').slideDown();
            } else {
                // Ẩn textbox khi bỏ chọn
                card.find('.passport-box').slideUp();
            }
        });
    });
</script>
</body>
</html>
